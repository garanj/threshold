name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-jvm-gate:
    name: Fast Host JVM Gate (Lint, Spotless, Unit & Screenshot Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Spotless Code Formatting Check
        run: ./gradlew spotlessCheck

      - name: Run Host JVM Unit & Screenshot Tests
        run: ./gradlew test

      - name: Validate Minified Release Build (R8 / ProGuard)
        run: ./gradlew :app:assembleRelease

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Screenshot Artifacts (on failure or inspection)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: roborazzi-screenshots
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore

      - name: Publish Host JVM Test Summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: "**/build/test-results/**/TEST-*.xml"

  emulator-smoke-gate:
    name: Headless Emulator Gate (Functional & Smoke Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          df -h

      - name: Enable KVM Hardware Virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Emulator Tests in AVD
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          disk-size: 4096M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: |
            ./scripts/test-emulator-functional.sh
            ./scripts/test-emulator-smoke.sh

      - name: Upload Instrumented Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-results
          path: "**/build/reports/androidTests/"
          if-no-files-found: ignore

      - name: Publish Emulator Test Summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: "**/build/outputs/androidTest-results/**/TEST-*.xml"
